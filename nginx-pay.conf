# ==============================================================================
# SemestaPay — Nginx Configuration for Static Build & Laravel API
# Domain: *.zet.web.id
# ==============================================================================

# 1. Landing Portal & Hub
server {
    listen 80;
    listen [::]:80;
    server_name pay.zet.web.id;
    root /var/www/semestapay/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

# 2. Admin Console (Next.js Static Export)
server {
    listen 80;
    listen [::]:80;
    server_name pay-admin.zet.web.id;
    root /var/www/semestapay/apps/web/admin/out;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

