<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <radialGradient id="glow-1" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-2" cx="80%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="50%" stop-color="#2d2b55"/>
      <stop offset="100%" stop-color="#131326"/>
    </linearGradient>

    <linearGradient id="gold-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <pattern id="grid-pat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid-pat)"/>
  <rect width="100%" height="100%" fill="url(#glow-1)"/>
  <rect width="100%" height="100%" fill="url(#glow-2)"/>

  <!-- Geometric Abstract Lines -->
  <g opacity="0.25">
    <circle cx="400" cy="550" r="320" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="400" cy="550" r="240" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="400" cy="550" r="160" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- Islamic Geometric Star Accent Motif in Background -->
  <g transform="translate(400, 180) scale(0.7)" opacity="0.18">
    <polygon points="0,-120 85,-85 120,0 85,85 0,120 -85,85 -120,0 -85,-85" fill="none" stroke="#818cf8" stroke-width="3"/>
    <polygon points="0,-120 85,-85 120,0 85,85 0,120 -85,85 -120,0 -85,-85" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(22.5)"/>
  </g>

  <!-- 3D Floating Smart Card Mockup -->
  <g transform="translate(400, 600) rotate(-7)" filter="url(#soft-shadow)">
    <!-- Main Card Body -->
    <rect x="-240" y="-150" width="480" height="300" rx="24" fill="url(#card-grad)" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Holographic Wave Accent Ribbon on Card -->
    <path d="M -240,40 Q -100,-30 80,60 T 240,-10 L 240,150 L -240,150 Z" fill="#4338ca" opacity="0.3"/>
    <path d="M -240,70 Q -80,-10 100,80 T 240,20 L 240,150 L -240,150 Z" fill="#0284c7" opacity="0.2"/>

    <!-- EMV Gold Chip -->
    <rect x="-190" y="-70" width="56" height="44" rx="8" fill="url(#gold-chip)"/>
    <rect x="-175" y="-70" width="26" height="44" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.5"/>
    <line x1="-190" y1="-48" x2="-134" y2="-48" stroke="#92400e" stroke-width="1.5" opacity="0.5"/>

    <!-- Contactless Radio Wave Icon -->
    <g transform="translate(-105, -48) scale(0.9)" stroke="#c7d2fe" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 0,-15 A 20,20 0 0,1 0,15"/>
      <path d="M 6,-22 A 30,30 0 0,1 6,22"/>
      <path d="M 12,-30 A 40,40 0 0,1 12,30"/>
    </g>

    <!-- Card Brand & Status -->
    <text x="190" y="-60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end" letter-spacing="2">SEMESTAPAY</text>
    <rect x="130" y="-40" width="60" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="160" y="-26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">ACTIVE</text>

    <!-- Card Number -->
    <text x="-190" y="50" font-family="monospace" font-size="20" font-weight="600" fill="#e0e7ff" letter-spacing="4">•••• •••• 2026 0001</text>

    <!-- Cardholder & Details -->
    <text x="-190" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1">STUDENT CARD</text>
    <text x="-190" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">AHMAD FAUZI</text>

    <text x="190" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="1">RFID UID</text>
    <text x="190" y="112" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="end">DEMO-UID-0001</text>
  </g>

  <!-- Glowing Floating Badge 1 (Tap Speed) -->
  <g transform="translate(200, 830)" filter="url(#soft-shadow)">
    <rect x="-10" y="-10" width="220" height="60" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="15" fill="#10b981" fill-opacity="0.2"/>
    <path d="M 17,20 L 21,24 L 28,16" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tap Transaksi</text>
    <text x="48" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Kecepatan &lt; 1 Detik</text>
  </g>

  <!-- Glowing Floating Badge 2 (Daily Limit Safe) -->
  <g transform="translate(480, 420)" filter="url(#soft-shadow)">
    <rect x="-10" y="-10" width="200" height="58" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="20" cy="19" r="14" fill="#6366f1" fill-opacity="0.25"/>
    <path d="M 15,19 L 20,13 L 25,19 L 20,25 Z" fill="#818cf8"/>
    <text x="45" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Proteksi Finansial</text>
    <text x="45" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#a5b4fc">Limit Harian Santri</text>
  </g>
</svg>
