services:
  mysql:
    image: mysql:8.0
    container_name: semestapay-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: cashless_pesantren
      MYSQL_USER: cashless
      MYSQL_PASSWORD: c5538319e7e81850ad93e9564cedfa9c
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: semestapay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: semestapay-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  mysql-data:
